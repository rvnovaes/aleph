[project]
name = "aleph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "django-ninja>=1.4,<2",
    "psycopg[binary]>=3.2,<4",
    "dj-database-url>=2,<4",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "pymarc>=5.3,<6",
    "pypdf>=6,<7",
    "pillow>=12.1.1,<14",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.11"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["catalog/tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
