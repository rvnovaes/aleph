- name: Prepare Aleph production host
  hosts: production
  become: true
  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, ufw, python3, rsync]
        state: present
        update_cache: true
    - name: Ensure keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
    - name: Download Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
    - name: Configure official Docker repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts.distribution_release }}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
    - name: Download Caddy signing key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /etc/apt/keyrings/caddy.asc
        mode: "0644"
    - name: Configure official Caddy repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/caddy.list
        mode: "0644"
        content: "deb [signed-by=/etc/apt/keyrings/caddy.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
"
    - name: Install Docker Compose and Caddy without opening the site yet
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin, docker-buildx-plugin, caddy]
        state: present
        update_cache: true
        policy_rc_d: 101
    - name: Enable Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
    - name: Prepare application and backup directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop: [/opt/aleph, /opt/aleph/backups, /opt/aleph/releases]
    - name: Allow SSH and HTTPS
      ansible.builtin.command:
        argv: [ufw, allow, "{{ item }}"]
      loop: ["22/tcp", "80/tcp", "443/tcp", "443/udp"]
      register: firewall_rule
      changed_when: "'Skipping' not in firewall_rule.stdout"
    - name: Check firewall state
      ansible.builtin.command: ufw status
      changed_when: false
      register: firewall_status
    - name: Enable firewall after allowing SSH
      ansible.builtin.command: ufw --force enable
      when: "'Status: inactive' in firewall_status.stdout"
      changed_when: true
