name: Production images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: production-images
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [backend, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate backend
        if: matrix.component == 'backend'
        run: |
          docker build -t aleph-test backend
          docker run --rm -e SECRET_KEY=ci-only-not-production -e DATABASE_URL=sqlite:////tmp/ci.sqlite aleph-test pytest -q -p no:cacheprovider
      - name: Validate frontend
        if: matrix.component == 'web'
        run: |
          docker build --target build -t aleph-web-test frontend
          docker run --rm aleph-web-test npm run check
          docker run --rm aleph-web-test node --test tests/citations.test.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable release
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.component == 'backend' && './backend' || './frontend' }}
          push: true
          platforms: linux/amd64
          build-args: UV_SYNC_FLAGS=--no-dev
          tags: ghcr.io/${{ github.repository_owner }}/aleph-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/aleph-${{ matrix.component }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
